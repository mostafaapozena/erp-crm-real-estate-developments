# Local development services for Phase 1 (ADR-0020).
#
# Development only. Never used for staging or production, which use managed services
# (MongoDB Atlas + managed Redis, ADR-0018).
#
# - Ports bind to 127.0.0.1 only: neither service is reachable from the network.
# - Credentials come from the untracked `docker/dev.env`, generated by `scripts/dev-services.mjs`.
#   No credential is written into this file.
# - MongoDB runs as a single-node **replica set**, because transactions require one and the
#   platform verifies transaction support (PLAT-014).
# - Image versions are pinned; named volumes keep development data across restarts.
#
# Managed by: npm run dev:services:up | :status | :down

name: alola-dev

services:
  mongodb:
    image: mongo:8.0.32
    container_name: alola-dev-mongodb
    restart: unless-stopped
    # The keyfile enables replica-set internal authentication. It is generated inside the container
    # on first start and kept in a named volume, so no secret is ever written to the host filesystem.
    command:
      - bash
      - -c
      - |
        set -e
        KEYFILE=/data/configdb/replset-keyfile
        if [ ! -f "$$KEYFILE" ]; then
          openssl rand -base64 756 > "$$KEYFILE"
        fi
        chmod 400 "$$KEYFILE"
        chown mongodb:mongodb "$$KEYFILE"
        exec docker-entrypoint.sh mongod \
          --replSet rs0 \
          --keyFile "$$KEYFILE" \
          --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set in docker/dev.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in docker/dev.env}
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      # `ping` needs no authentication, so this reports health before and after replica-set
      # initiation. Replica-set state is verified separately by scripts/dev-services.mjs.
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.runCommand({ping:1}).ok" | grep -q 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 20s

  redis:
    image: redis:8.10.1-alpine
    container_name: alola-dev-redis
    restart: unless-stopped
    # Append-only persistence so development queues and locks survive a restart.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set in docker/dev.env}
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in docker/dev.env}
    stop_grace_period: 20s

volumes:
  mongodb-data:
    name: alola-dev-mongodb-data
  mongodb-config:
    name: alola-dev-mongodb-config
  redis-data:
    name: alola-dev-redis-data
