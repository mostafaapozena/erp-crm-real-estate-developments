# Quality pipeline (TEST-002). Defined for when a remote exists; the repository currently has no
# remote and this workflow has never run on a hosted runner. `npm run verify` runs the same gates
# locally.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run check:deps
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
